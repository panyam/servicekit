name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-versions.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: scripts/check-deps.sh
      - run: go test -race ./...
      - run: make exercise

  # hybrid/ is its own module (grpc-gateway, Connect), so the root job's
  # ./... skips it.
  hybrid:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hybrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hybrid/go.mod
          cache-dependency-path: hybrid/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: make exercise

  ts-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      # test/exports.test.mjs resolves the package's entry points, which name files in dist.
      - run: npm run build
      - run: npm test
